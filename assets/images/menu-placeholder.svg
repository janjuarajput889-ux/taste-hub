<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Taste Hub menu image placeholder</title>
  <desc id="description">A warm, neutral placeholder image for a Taste Hub menu item.</desc>
  <defs>
    <radialGradient id="glow" cx="74%" cy="24%" r="70%">
      <stop offset="0" stop-color="#6a4e14" stop-opacity=".7"/>
      <stop offset="1" stop-color="#171714" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f4ead4"/>
      <stop offset="1" stop-color="#b8aa8d"/>
