  <circle cx="600" cy="365" r="238" fill="#090909" opacity=".35"/>
  <circle cx="580" cy="340" r="222" fill="url(#plate)"/>
  <circle cx="580" cy="340" r="180" fill="#27251f"/>
  <circle cx="580" cy="340" r="165" fill="#1e1d19" stroke="#d3a83c" stroke-opacity=".5" stroke-width="3"/>
