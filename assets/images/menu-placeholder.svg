  <text x="600" y="672" fill="#f5f1e7" font-family="Georgia,serif" font-size="34" text-anchor="middle" letter-spacing="2">TASTE HUB</text>
  <text x="600" y="714" fill="#a8a397" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">MENU IMAGE COMING SOON</text>
